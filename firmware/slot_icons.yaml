# Icones reelles (vraies icones d'appli/jeu extraites cote PC, voir
# icon_extract.py) pour les 16 emplacements - une entite online_image par
# emplacement, fetch declenche depuis slots_*.yaml (voir "Slot N - icone").
# NB: online_image est un composant a part entiere dans cette version
# d'ESPHome (cle top-level 'online_image:', pas 'image: platform:'). Le
# telechargement etant async, on_download_finished force LVGL a redessiner
# le widget une fois les pixels reellement prets (sinon reste vide).
online_image:
  - {id: slot1_icon_img, url: "http://0.0.0.0/x.png", format: PNG, type: RGB565, resize: 32x32, buffer_size: 8192, update_interval: never, http_request_id: http_client, on_download_finished: [{lambda: "lv_obj_invalidate(id(slot1_icon_widget));"}]}
