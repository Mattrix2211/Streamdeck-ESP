# Fichier a utiliser si vous flashez directement depuis un PC avec la CLI
# ESPHome (`esphome run streamdeck.yaml`), en ayant clone tout le depot.
#
# Si vous passez par l'add-on ESPHome Builder de Home Assistant, utilisez
# plutot `ha-device.yaml.example` (qui recupere package.yaml directement
# depuis GitHub, sans avoir besoin du reste du depot en local).

substitutions:
  name: "streamdeck"
  friendly_name: "Stream Deck"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32p4
  # Decommentez si votre carte est un exemplaire d'ingenierie pre-serie
  # (revision de silicium < v3.0) :
  # engineering_sample: true

logger:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: true

# API native chiffree - utilisee par Home Assistant ET par pc-app/
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  hardware_and_ui:
    file: package.yaml
