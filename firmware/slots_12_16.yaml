# Entites des emplacements 12 a 16 (voir docs/ARCHITECTURE.md pour le
# systeme de 16 emplacements configurables). Genere, ne pas editer a la main.
text:
  - platform: template
    id: slot12_label
    name: "Slot 12 - libelle"
    mode: text
    optimistic: true
    initial_value: "Slot 12"
    max_length: 24
    on_value:
      - lvgl.label.update: { id: slot12_title, text: !lambda "return x;" }
  - platform: template
    id: slot12_value
    name: "Slot 12 - valeur"
    mode: text
    optimistic: true
    initial_value: ""
    max_length: 24
    on_value:
      - lvgl.label.update: { id: slot12_value_lbl, text: !lambda "return x;" }
      - lambda: |-
          char *endptr;
          long v = strtol(x.c_str(), &endptr, 10);
          if (endptr != x.c_str()) {
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            lv_bar_set_value(id(slot12_bar), (int) v, LV_ANIM_OFF);
          }
  - platform: template
    id: slot12_icon
    name: "Slot 12 - icone"
    mode: text
    optimistic: true
    initial_value: ""
    max_length: 8
    on_value:
      - lvgl.label.update: { id: slot12_icon_lbl, text: !lambda "return x;" }
