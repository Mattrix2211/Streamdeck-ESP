# Package partage du Stream Deck : hardware + UI, rien de secret/specifique
# a un appareil. Importe via `packages:` (voir ha-device.yaml.example) ou
# inclus localement (voir streamdeck.yaml). Carte : Guition JC1060P470C_I_W
# (ESP32-P4 + ESP32-C6, ecran IPS 7" 1024x600, tactile GT911, Wi-Fi/BT via
# le C6 en co-processeur SDIO). HA et l'appli PC (pc-app/) se connectent
# tous deux a la MEME API native ESPHome chiffree (aioesphomeapi cote PC).
#
# GPIO encodeurs : uniquement ceux confirmes disponibles sur le header
# d'extension (colonne gauche GPIO1-5/20/32/33, droite GPIO45-47). GPIO5 est
# le reset interne de la dalle, evitez-le. Verifiez contre votre revision.

esp32:
  flash_size: 16MB
  cpu_frequency: 360MHZ
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# Le P4 n'a pas de radio: le C6 embarque le Wi-Fi/BT et sert de co-processeur
# "hosted" relie en SDIO.
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

psram:
  mode: hex
  speed: 200MHz

# Alimente le PHY MIPI-DSI de l'ecran (obligatoire sur ESP32-P4)
esp_ldo:
  - channel: 3
    voltage: 2.5V

# ---------------------------------------------------------------------------
# Tactile GT911 (bus I2C interne, pas sur le header)
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# Pas de transform ici : la dalle est utilisee dans son orientation native
# (rotation: 0, valeur par defaut de display.mipi_dsi). swap_xy/mirror_y
# etaient necessaires dans la config communautaire de reference parce que sa
# dalle etait montee a 90 - ce n'est pas notre cas, ca decalait le tactile.
touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: GPIO22
    interrupt_pin: GPIO21

# ---------------------------------------------------------------------------
# Retroeclairage
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Retroeclairage ecran"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# ---------------------------------------------------------------------------
# Dalle MIPI-DSI - le modele JC1060P470 est fourni nativement par ESPHome
# (timings corrects deja integres, pas besoin de les redefinir)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    model: JC1060P470
    reset_pin:
      number: GPIO5
    update_interval: never
    auto_clear_enabled: false

binary_sensor:
  - platform: status
    name: "Stream Deck en ligne"
    id: status_online
    on_state:
      - lvgl.obj.update:
          id: status_dot
          bg_color: !lambda "return x ? Color(0x16, 0xB8, 0x4E) : Color(0xE6, 0x39, 0x46);"

  # --- Boutons des encodeurs rotatifs (clic sur l'axe) ---
  - platform: gpio
    id: encoder1_button
    name: "Encodeur 1 - bouton"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - event.trigger: { id: encoder1_event, event_type: "press" }
      - lvgl.obj.update:
          id: encoder1_card
          border_color: 0x00B4D8
          bg_color: 0x1E4060
    on_release:
      - lvgl.obj.update:
          id: encoder1_card
          border_color: 0x1A3A52
          bg_color: 0x0F2942
  - platform: gpio
    id: encoder2_button
    name: "Encodeur 2 - bouton"
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - event.trigger: { id: encoder2_event, event_type: "press" }
      - lvgl.obj.update:
          id: encoder2_card
          border_color: 0x00B4D8
          bg_color: 0x1E4060
    on_release:
      - lvgl.obj.update:
          id: encoder2_card
          border_color: 0x1A3A52
          bg_color: 0x0F2942
  - platform: gpio
    id: encoder3_button
    name: "Encodeur 3 - bouton"
    pin:
      number: GPIO46
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - event.trigger: { id: encoder3_event, event_type: "press" }
      - lvgl.obj.update:
          id: encoder3_card
          border_color: 0x00B4D8
          bg_color: 0x1E4060
    on_release:
      - lvgl.obj.update:
          id: encoder3_card
          border_color: 0x1A3A52
          bg_color: 0x0F2942

# ---------------------------------------------------------------------------
# Encodeurs rotatifs - 3 par defaut, ajustables selon ce que vous avez achete.
# Pour en ajouter/retirer : dupliquer un bloc sensor+binary_sensor+event avec
# des GPIO libres (il reste GPIO47 sur le header dans ce mapping).
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: encoder1_value
    name: "Encodeur 1"
    pin_a:
      number: GPIO1
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO2
      mode: INPUT_PULLUP
    on_clockwise:
      - event.trigger: { id: encoder1_event, event_type: "clockwise" }
    on_anticlockwise:
      - event.trigger: { id: encoder1_event, event_type: "anticlockwise" }
    on_value:
      - lvgl.label.update:
          id: lbl_encoder1
          text: !lambda "return to_string((int) x);"
  - platform: rotary_encoder
    id: encoder2_value
    name: "Encodeur 2"
    pin_a:
      number: GPIO4
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO20
      mode: INPUT_PULLUP
    on_clockwise:
      - event.trigger: { id: encoder2_event, event_type: "clockwise" }
    on_anticlockwise:
      - event.trigger: { id: encoder2_event, event_type: "anticlockwise" }
    on_value:
      - lvgl.label.update:
          id: lbl_encoder2
          text: !lambda "return to_string((int) x);"
  - platform: rotary_encoder
    id: encoder3_value
    name: "Encodeur 3"
    pin_a:
      number: GPIO33
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO45
      mode: INPUT_PULLUP
    on_clockwise:
      - event.trigger: { id: encoder3_event, event_type: "clockwise" }
    on_anticlockwise:
      - event.trigger: { id: encoder3_event, event_type: "anticlockwise" }
    on_value:
      - lvgl.label.update:
          id: lbl_encoder3
          text: !lambda "return to_string((int) x);"

# ---------------------------------------------------------------------------
# Entites "event" - consommees a la fois par Home Assistant (declencheurs
# d'automation natifs) et par l'appli PC (aioesphomeapi) pour mapper vers des
# actions locales (raccourcis, media, volume, lancement d'appli...).
# ---------------------------------------------------------------------------
event:
  - platform: template
    id: encoder1_event
    name: "Encodeur 1 - evenement"
    event_types: ["clockwise", "anticlockwise", "press"]
  - platform: template
    id: encoder2_event
    name: "Encodeur 2 - evenement"
    event_types: ["clockwise", "anticlockwise", "press"]
  - platform: template
    id: encoder3_event
    name: "Encodeur 3 - evenement"
    event_types: ["clockwise", "anticlockwise", "press"]
  - platform: template
    id: action_button_event
    name: "Bouton d'action ecran"
    event_types:
      [
        "action_1", "action_2", "action_3", "action_4",
        "action_5", "action_6", "action_7", "action_8",
        "action_9", "action_10", "action_11", "action_12",
        "action_13", "action_14", "action_15", "action_16",
      ]

# Texte pousse par l'appli PC (titre en cours, volume, notification...) et
# affiche sur l'ecran. Ecrit via l'API native (text_command), pas de HTTP.
text:
  - platform: template
    id: pc_status_text
    name: "Statut PC"
    mode: text
    optimistic: true
    initial_value: "PC hors ligne"
    max_length: 64
    on_value:
      - lvgl.label.update:
          id: lbl_pc_status
          text: !lambda "return x;"

# ---------------------------------------------------------------------------
# 16 emplacements configurables (boutons/widgets) - entites generees dans
# slots_1_5.yaml / slots_6_11.yaml / slots_12_16.yaml (decoupees pour rester
# sous 500 lignes chacune). Chaque emplacement expose : libelle, valeur,
# icone, type (bouton/barre/texte) et visibilite - tout pilotable a chaud
# depuis l'appli PC (pc-app/streamdeck_companion) sans reflasher.
# ---------------------------------------------------------------------------
packages:
  slots_1_5: !include slots_1_5.yaml
  slots_6_11: !include slots_6_11.yaml
  slots_12_16: !include slots_12_16.yaml

# ---------------------------------------------------------------------------
# Forme des boutons - modifiable a chaud (carre ou rond) depuis Home
# Assistant (service select.select_option) ou l'appli PC. radius 12 = coins
# arrondis (carre), radius 999 = LVGL plafonne au maximum possible -> cercle.
# S'applique aux 16 emplacements (inoffensif sur les emplacements de type
# widget, qui n'utilisent que le style de coin du conteneur).
# ---------------------------------------------------------------------------
select:
  - platform: template
    id: button_shape
    name: "Forme des boutons"
    optimistic: true
    options: ["carre", "rond"]
    initial_option: "carre"
    on_value:
      - lambda: |-
          int r = (x == "rond") ? 999 : 12;
          for (int i = 1; i <= 16; i++) {
            lv_obj_t *btn = nullptr;
            switch (i) {
              case 1: btn = id(slot1_btn); break;
              case 2: btn = id(slot2_btn); break;
              case 3: btn = id(slot3_btn); break;
              case 4: btn = id(slot4_btn); break;
              case 5: btn = id(slot5_btn); break;
              case 6: btn = id(slot6_btn); break;
              case 7: btn = id(slot7_btn); break;
              case 8: btn = id(slot8_btn); break;
              case 9: btn = id(slot9_btn); break;
              case 10: btn = id(slot10_btn); break;
              case 11: btn = id(slot11_btn); break;
              case 12: btn = id(slot12_btn); break;
              case 13: btn = id(slot13_btn); break;
              case 14: btn = id(slot14_btn); break;
              case 15: btn = id(slot15_btn); break;
              case 16: btn = id(slot16_btn); break;
            }
            lv_obj_set_style_radius(btn, r, 0);
          }

# ---------------------------------------------------------------------------
# Polices Google Fonts du design system (telechargees et converties au build)
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Space Grotesk@600"
    id: font_title
    size: 26
  - file: "gfonts://Inter"
    id: font_body
    size: 16
  - file: "gfonts://JetBrains Mono@500"
    id: font_mono
    size: 15
  # Icones des emplacements - police d'icones dediee (glyphes Material Icons,
  # codepoints verifies aupres du fichier officiel MaterialIcons-Regular.
  # codepoints). L'appli PC envoie directement le glyphe (voir pc-app/
  # streamdeck_companion/icons.py), le firmware ne fait qu'afficher le texte
  # recu - glyphs: limite la police embarquee a ce jeu d'icones uniquement.
  - file: "gfonts://Material Icons"
    id: font_icons
    size: 28
    glyphs:
      [
        "", "", "", "", "", "", "",
        "", "", "", "", "", "", "",
        "", "", "", "", "", "", "",
        "", "",
      ]
  - file: "gfonts://JetBrains Mono@700"
    id: font_mono_bold
    size: 22

# Pas d'image externe ici volontairement : les chemins de fichiers dans un
# package importe via `packages: url:` (Home Assistant) se resolvent par
# rapport au fichier LOCAL qui importe le package, pas par rapport a ce
# fichier recupere sur GitHub - une image externe casserait donc la
# compilation cote HA a chaque fois sans copie manuelle. Le logo requin du
# design system (firmware/images/logo.png) reste disponible dans le repo
# pour un usage web/print, mais n'est pas affiche sur cet ecran.

# ---------------------------------------------------------------------------
# Interface LVGL - palette design system :
#   fond   navy   #0B1929   surface ocean #0F2942   bordure slate #1A3A52
#   accent signal #00B4D8   texte secondaire mist #8FAFC7
#   statut ok green-tech #16B84E   statut danger red #E63946
# ---------------------------------------------------------------------------
lvgl:
  displays: my_display
  touchscreens: my_touchscreen
  color_depth: 16
  byte_order: little_endian
  buffer_size: 100%
  pages:
    - id: home_page
      bg_color: 0x0B1929
      widgets:
        # Barre du haut : titre, pastille d'etat
        - obj:
            height: 64
            width: 100%
            align: top_mid
            bg_opa: transp
            border_width: 0
            pad_all: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_cross: center
              flex_align_main: start
            widgets:
              - label:
                  text: "STREAM DECK"
                  text_font: font_title
                  text_color: 0xFFFFFF
              - obj:
                  id: status_dot
                  width: 14
                  height: 14
                  radius: 7
                  x: 200
                  bg_color: 0xE63946
                  border_width: 0

        # Grille de 16 emplacements configurables (boutons/widgets). Forme
        # (carre/rond) pilotee par "button_shape", contenu/visibilite par
        # les entites generees dans slots_*.yaml (voir docs/ARCHITECTURE.md).
        - obj:
            id: action_grid
            height: 420
            width: 700
            y: 64
            align: top_mid
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_cross: start
              flex_align_main: start
              pad_row: 12
              pad_column: 12
            widgets: !include slot_widgets.yaml

        # Bas d'ecran : 3 cartes encodeurs + statut PC
        - obj:
            height: 80
            width: 100%
            y: 488
            bg_opa: transp
            border_width: 0
            pad_all: 4
            layout:
              type: flex
              flex_flow: row
              flex_align_cross: center
              flex_align_main: space_evenly
            widgets:
              - obj:
                  id: encoder1_card
                  width: 300
                  height: 66
                  bg_color: 0x0F2942
                  border_color: 0x1A3A52
                  border_width: 1
                  radius: 12
                  pad_all: 8
                  widgets:
                    - label:
                        text: "ENCODEUR 1"
                        text_font: font_mono
                        text_color: 0x8FAFC7
                        align: top_left
                    - label:
                        id: lbl_encoder1
                        text: "0"
                        text_font: font_mono_bold
                        text_color: 0x00B4D8
                        align: bottom_left
              - obj:
                  id: encoder2_card
                  width: 300
                  height: 66
                  bg_color: 0x0F2942
                  border_color: 0x1A3A52
                  border_width: 1
                  radius: 12
                  pad_all: 8
                  widgets:
                    - label:
                        text: "ENCODEUR 2"
                        text_font: font_mono
                        text_color: 0x8FAFC7
                        align: top_left
                    - label:
                        id: lbl_encoder2
                        text: "0"
                        text_font: font_mono_bold
                        text_color: 0x00B4D8
                        align: bottom_left
              - obj:
                  id: encoder3_card
                  width: 300
                  height: 66
                  bg_color: 0x0F2942
                  border_color: 0x1A3A52
                  border_width: 1
                  radius: 12
                  pad_all: 8
                  widgets:
                    - label:
                        text: "ENCODEUR 3"
                        text_font: font_mono
                        text_color: 0x8FAFC7
                        align: top_left
                    - label:
                        id: lbl_encoder3
                        text: "0"
                        text_font: font_mono_bold
                        text_color: 0x00B4D8
                        align: bottom_left

        - label:
            id: lbl_pc_status
            text: "PC hors ligne"
            text_font: font_mono
            text_color: 0x6B8BA4
            align: bottom_mid
            y: -8
