name: PC App Core Tests

on:
  push:
    paths:
      - "pc-app/streamdeck_companion/core/**"
      - "pc-app/streamdeck_companion/actions.py"
      - "pc-app/streamdeck_companion/device_events.py"
      - "pc-app/streamdeck_companion/device_event_runtime.py"
      - "pc-app/streamdeck_companion/device_protocol.py"
      - "pc-app/streamdeck_companion/esphome_device_port.py"
      - "pc-app/streamdeck_companion/esphome_port_runtime.py"
      - "pc-app/streamdeck_companion/esphome_slot_projection.py"
      - "pc-app/streamdeck_companion/navigation_legacy.py"
      - "pc-app/streamdeck_companion/state_adapters.py"
      - "pc-app/streamdeck_companion/runtime_state.py"
      - "pc-app/streamdeck_companion/state_protocol_bridge.py"
      - "pc-app/streamdeck_companion/runtime_action_catalog.py"
      - "pc-app/streamdeck_companion/dashboard_v2_catalog.py"
      - "pc-app/streamdeck_companion/dashboard_action_choices.py"
      - "pc-app/streamdeck_companion/dashboard_v2_api.py"
      - "pc-app/streamdeck_companion/dashboard_v2_routes.py"
      - "pc-app/streamdeck_companion/v2_device_client.py"
      - "pc-app/streamdeck_companion/tray.py"
      - "pc-app/streamdeck_companion/ha_poller.py"
      - "pc-app/streamdeck_companion/ha_mqtt.py"
      - "pc-app/tests/**"
      - "pc-app/requirements-dev.txt"
      - "pc-app/pyproject.toml"
      - ".github/workflows/pc-app-core-tests.yml"
  pull_request:
    paths:
      - "pc-app/streamdeck_companion/core/**"
      - "pc-app/streamdeck_companion/actions.py"
      - "pc-app/streamdeck_companion/device_events.py"
      - "pc-app/streamdeck_companion/device_event_runtime.py"
      - "pc-app/streamdeck_companion/device_protocol.py"
      - "pc-app/streamdeck_companion/esphome_device_port.py"
      - "pc-app/streamdeck_companion/esphome_port_runtime.py"
      - "pc-app/streamdeck_companion/esphome_slot_projection.py"
      - "pc-app/streamdeck_companion/navigation_legacy.py"
      - "pc-app/streamdeck_companion/state_adapters.py"
      - "pc-app/streamdeck_companion/runtime_state.py"
      - "pc-app/streamdeck_companion/state_protocol_bridge.py"
      - "pc-app/streamdeck_companion/runtime_action_catalog.py"
      - "pc-app/streamdeck_companion/dashboard_v2_catalog.py"
      - "pc-app/streamdeck_companion/dashboard_action_choices.py"
      - "pc-app/streamdeck_companion/dashboard_v2_api.py"
      - "pc-app/streamdeck_companion/dashboard_v2_routes.py"
      - "pc-app/streamdeck_companion/v2_device_client.py"
      - "pc-app/streamdeck_companion/tray.py"
      - "pc-app/streamdeck_companion/ha_poller.py"
      - "pc-app/streamdeck_companion/ha_mqtt.py"
      - "pc-app/tests/**"
      - "pc-app/requirements-dev.txt"
      - "pc-app/pyproject.toml"
      - ".github/workflows/pc-app-core-tests.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Core quality tooling
        working-directory: pc-app
        run: python -m pip install -r requirements-dev.txt

      - name: Lint V2 Core and adapters
        working-directory: pc-app
        run: >-
          ruff check
          streamdeck_companion/core
          streamdeck_companion/device_events.py
          streamdeck_companion/device_event_runtime.py
          streamdeck_companion/device_protocol.py
          streamdeck_companion/esphome_device_port.py
          streamdeck_companion/esphome_port_runtime.py
          streamdeck_companion/esphome_slot_projection.py
          streamdeck_companion/navigation_legacy.py
          streamdeck_companion/state_adapters.py
          streamdeck_companion/runtime_state.py
          streamdeck_companion/state_protocol_bridge.py
          streamdeck_companion/runtime_action_catalog.py
          streamdeck_companion/dashboard_v2_catalog.py
          streamdeck_companion/dashboard_action_choices.py
          streamdeck_companion/dashboard_v2_api.py
          streamdeck_companion/dashboard_v2_routes.py
          streamdeck_companion/v2_device_client.py

      - name: Type-check V2 Core and independent adapters
        working-directory: pc-app
        run: >-
          mypy
          streamdeck_companion/core
          streamdeck_companion/device_events.py
          streamdeck_companion/device_event_runtime.py
          streamdeck_companion/device_protocol.py
          streamdeck_companion/esphome_device_port.py
          streamdeck_companion/esphome_port_runtime.py
          streamdeck_companion/esphome_slot_projection.py
          streamdeck_companion/navigation_legacy.py
          streamdeck_companion/state_adapters.py
          streamdeck_companion/runtime_state.py
          streamdeck_companion/state_protocol_bridge.py
          streamdeck_companion/runtime_action_catalog.py
          streamdeck_companion/dashboard_v2_catalog.py
          streamdeck_companion/dashboard_action_choices.py
          streamdeck_companion/dashboard_v2_api.py
          streamdeck_companion/dashboard_v2_routes.py

      - name: Type-check V2 DeviceClient wrapper boundary
        working-directory: pc-app
        run: mypy --follow-imports=skip streamdeck_companion/v2_device_client.py

      - name: Compile live runtime integrations
        working-directory: pc-app
        run: >-
          python -m py_compile
          streamdeck_companion/ha_poller.py
          streamdeck_companion/ha_mqtt.py
          streamdeck_companion/tray.py
          streamdeck_companion/esphome_device_port.py
          streamdeck_companion/esphome_port_runtime.py
          streamdeck_companion/esphome_slot_projection.py
          streamdeck_companion/runtime_action_catalog.py
          streamdeck_companion/dashboard_v2_catalog.py
          streamdeck_companion/dashboard_action_choices.py
          streamdeck_companion/dashboard_v2_api.py
          streamdeck_companion/dashboard_v2_routes.py
          streamdeck_companion/v2_device_client.py

      - name: Run Core and compatibility tests
        working-directory: pc-app
        run: python -m unittest discover -s tests -v
